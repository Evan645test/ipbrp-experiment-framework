<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="數位學習研究論文互動導讀首頁，可在同一個 HTML 切換閱讀不同論文。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1425'/%3E%3Cpath d='M15 17h15c5 0 8 3 8 8v25c-2-3-5-4-9-4H15V17Zm34 0H34c-5 0-8 3-8 8v25c2-3 5-4 9-4h14V17Z' fill='none' stroke='%2329d3c2' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>數位學習論文導讀庫</title>
  <style>
    :root {
      color-scheme:dark;
      --bg:#080d19;
      --surface:#10182a;
      --surface-2:#151f34;
      --ink:#f6f8fc;
      --muted:#aab6cc;
      --line:#2a3853;
      --cyan:#29d3c2;
      --yellow:#ffb000;
      --violet:#7c6cff;
      --danger:#ff6b72;
      --shadow:0 24px 70px rgba(0,0,0,.34);
    }
    * { box-sizing:border-box; }
    html { min-width:320px; min-height:100%; background:var(--bg); scroll-behavior:smooth; }
    body { min-width:320px; min-height:100vh; margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif; }
    button,select { font:inherit; }
    button:focus-visible,select:focus-visible,a:focus-visible,iframe:focus-visible { outline:3px solid var(--cyan); outline-offset:3px; }
    .skip-link { position:fixed; z-index:100; top:8px; left:8px; padding:10px 14px; border-radius:9px; background:#fff; color:#07111f; transform:translateY(-150%); }
    .skip-link:focus { transform:none; }
    .home-view { min-height:100vh; overflow:hidden; background:radial-gradient(circle at 88% 6%,rgba(124,108,255,.24),transparent 28rem),radial-gradient(circle at 5% 48%,rgba(41,211,194,.13),transparent 30rem),var(--bg); }
    .masthead { width:min(1180px,calc(100% - 36px)); margin:auto; padding:28px 0 18px; }
    .brandline { display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:flex; gap:12px; align-items:center; color:var(--ink); font-weight:850; letter-spacing:.05em; }
    .mark { display:grid; width:36px; height:36px; place-items:center; border:1px solid rgba(41,211,194,.55); border-radius:11px; color:var(--cyan); box-shadow:inset 0 0 0 4px rgba(41,211,194,.06); }
    .count { color:var(--muted); font-size:.86rem; font-variant-numeric:tabular-nums; }
    .intro { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,.36fr); gap:28px; align-items:end; padding:clamp(54px,9vw,116px) 0 42px; }
    .eyebrow { margin:0 0 12px; color:var(--cyan); font-size:.8rem; font-weight:850; letter-spacing:.18em; text-transform:uppercase; }
    h1 { max-width:900px; margin:0; font-family:"Noto Serif TC","Songti TC",serif; font-size:clamp(2.5rem,7vw,6.2rem); font-weight:700; letter-spacing:-.035em; line-height:.98; text-wrap:balance; }
    .intro-copy { margin:0 0 5px; color:var(--muted); font-size:clamp(1rem,1.5vw,1.16rem); line-height:1.8; }
    .library { width:min(1180px,calc(100% - 36px)); margin:auto; padding:0 0 72px; }
    .section-title { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:0 0 16px; padding-top:18px; border-top:1px solid var(--line); }
    .section-title h2 { margin:0; font-size:1.15rem; letter-spacing:.06em; }
    .section-title p { margin:0; color:var(--muted); font-size:.84rem; }
    .paper-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .paper-card { --accent:var(--cyan); position:relative; display:flex; min-height:430px; overflow:hidden; flex-direction:column; padding:0; border:1px solid var(--line); border-radius:22px; background:linear-gradient(160deg,rgba(255,255,255,.035),transparent 58%),var(--surface); color:var(--ink); text-align:left; cursor:pointer; box-shadow:var(--shadow); transition:transform .18s ease,border-color .18s ease,background .18s ease; }
    .paper-card:hover { transform:translateY(-5px); border-color:var(--accent); background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent 58%),var(--surface); }
    .paper-card::before { position:absolute; inset:0 0 auto; height:5px; background:var(--accent); content:""; }
    .card-head { display:flex; align-items:center; justify-content:space-between; padding:24px 24px 18px; }
    .paper-number { color:var(--accent); font:800 clamp(2.8rem,5vw,4.7rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.08em; }
    .paper-year { padding:6px 9px; border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line)); border-radius:999px; color:var(--muted); font-size:.75rem; font-weight:750; }
    .card-body { display:flex; flex:1; flex-direction:column; padding:0 24px 24px; }
    .journal { margin:0 0 14px; color:var(--muted); font-size:.74rem; font-weight:780; letter-spacing:.09em; line-height:1.5; text-transform:uppercase; }
    .paper-card h3 { margin:0; font-size:clamp(1.35rem,2.2vw,2rem); line-height:1.3; text-wrap:balance; }
    .subtitle { margin:9px 0 0; color:var(--accent); font-size:.95rem; font-weight:720; line-height:1.55; }
    .description { margin:18px 0 22px; color:var(--muted); font-size:.96rem; line-height:1.75; }
    .tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:auto; }
    .tag { padding:6px 9px; border:1px solid var(--line); border-radius:8px; color:#c7d0e1; font-size:.75rem; }
    .open-line { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:21px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink); font-weight:820; }
    .open-line span:last-child { color:var(--accent); font-size:1.3rem; transition:transform .18s ease; }
    .paper-card:hover .open-line span:last-child { transform:translateX(4px); }
    .reader-view { display:none; width:100%; height:100dvh; min-height:520px; flex-direction:column; background:#eef1f6; }
    .reader-view.active { display:flex; }
    .reader-bar { --accent:var(--cyan); z-index:20; display:flex; flex:0 0 auto; gap:12px; align-items:center; min-height:66px; padding:10px max(12px,env(safe-area-inset-left)); border-bottom:1px solid #273551; background:#0c1323; color:#fff; box-shadow:0 8px 25px rgba(5,10,20,.22); }
    .reader-home,.reader-action { display:inline-flex; min-height:42px; align-items:center; justify-content:center; gap:7px; padding:8px 12px; border:1px solid #33415b; border-radius:10px; background:#141e32; color:#fff; font-weight:760; cursor:pointer; }
    .reader-home:hover,.reader-action:hover { border-color:var(--accent); color:var(--accent); }
    .reader-identity { min-width:0; flex:1; }
    .reader-kicker { margin:0 0 2px; color:var(--accent); font-size:.69rem; font-weight:850; letter-spacing:.13em; text-transform:uppercase; }
    .reader-title { overflow:hidden; margin:0; font-size:.95rem; font-weight:820; white-space:nowrap; text-overflow:ellipsis; }
    .reader-controls { display:flex; flex:0 0 auto; gap:7px; align-items:center; }
    .paper-select { max-width:270px; min-height:42px; padding:8px 34px 8px 11px; border:1px solid #33415b; border-radius:10px; background:#141e32; color:#fff; cursor:pointer; }
    .reader-action:disabled { opacity:.38; cursor:not-allowed; }
    .frame-stage { position:relative; min-height:0; flex:1; }
    .paper-frame { width:100%; height:100%; border:0; background:#fff; }
    .frame-loading { position:absolute; z-index:5; inset:0; display:grid; place-items:center; background:#eef1f6; color:#344054; font-weight:750; }
    .frame-loading[hidden] { display:none; }
    .loader { display:flex; gap:10px; align-items:center; padding:13px 16px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; box-shadow:0 12px 36px rgba(15,23,42,.12); }
    .loader::before { width:17px; height:17px; border:3px solid #d3d9e4; border-top-color:var(--violet); border-radius:50%; content:""; animation:spin .8s linear infinite; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:900px) {
      .intro { grid-template-columns:1fr; gap:16px; }
      .intro-copy { max-width:650px; }
      .paper-grid { grid-template-columns:1fr; }
      .paper-card { min-height:0; }
    }
    @media (max-width:680px) {
      .masthead,.library { width:min(100% - 24px,1180px); }
      .masthead { padding-top:18px; }
      .intro { padding:44px 0 32px; }
      h1 { font-size:clamp(2.55rem,15vw,4.2rem); line-height:1.03; }
      .section-title { align-items:flex-start; flex-direction:column; gap:5px; }
      .paper-card { border-radius:17px; }
      .card-head { padding:21px 20px 15px; }
      .card-body { padding:0 20px 20px; }
      .reader-bar { flex-wrap:wrap; gap:8px; padding:8px; }
      .reader-home { order:1; }
      .reader-identity { order:2; width:calc(100% - 116px); }
      .reader-controls { order:3; width:100%; }
      .paper-select { min-width:0; flex:1; max-width:none; }
      .reader-action { padding-inline:10px; }
      .action-label { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
    @media print {
      body { background:#fff; color:#111; }
      .masthead { padding-top:0; }
      .home-view { background:#fff; }
      .paper-card { min-height:0; break-inside:avoid; box-shadow:none; color:#111; }
      .reader-bar { display:none; }
      .reader-view { height:auto; }
      .frame-stage,.paper-frame { height:100vh; }
    }
  </style>
</head>

  <main id="homeView" class="home-view">

      <div class="intro">
        <div>

          <h1>論文導讀<br>集中閱讀</h1>

      <div id="paperGrid" class="paper-grid"></div>

  <section id="readerView" class="reader-view" aria-label="論文閱讀器">

        <button id="previousButton" class="reader-action" type="button" aria-label="上一篇論文"><span aria-hidden="true">←</span><span class="action-label">上一篇</span></button>
        <button id="nextButton" class="reader-action" type="button" aria-label="下一篇論文"><span class="action-label">下一篇</span><span aria-hidden="true">→</span></button>
        <button id="printButton" class="reader-action" type="button" aria-label="列印目前論文"><span aria-hidden="true">⌘P</span><span class="action-label">列印</span></button>
      </nav>
    </header>
    <div class="frame-stage">
      <div id="frameLoading" class="frame-loading" role="status" aria-live="polite"><span class="loader">正在開啟導讀</span></div>
      <iframe id="paperFrame" class="paper-frame" title="論文互動導讀" sandbox="allow-scripts allow-same-origin allow-modals allow-popups"></iframe>
    </div>
  </section>

    const paperGrid=document.getElementById("paperGrid");
    const homeView=document.getElementById("homeView");
    const readerView=document.getElementById("readerView");
    const readerBar=document.getElementById("readerBar");
    const paperFrame=document.getElementById("paperFrame");
    const frameLoading=document.getElementById("frameLoading");
    const paperSelect=document.getElementById("paperSelect");
    const readerKicker=document.getElementById("readerKicker");
    const readerTitle=document.getElementById("readerTitle");
    const previousButton=document.getElementById("previousButton");
    const nextButton=document.getElementById("nextButton");
    let currentIndex=-1;
    let iframeKeyHandler=null;

    function decodePage(value){
      const bytes=Uint8Array.from(atob(value),function(character){return character.charCodeAt(0)});
      return new TextDecoder("utf-8").decode(bytes);
    }

    function make(tag,className,text){
      const element=document.createElement(tag);
      if(className)element.className=className;
      if(text!==undefined)element.textContent=text;
      return element;
    }

    function renderHome(){
      papers.forEach(function(paper,index){
        const card=make("button","paper-card");
        card.type="button";
        card.style.setProperty("--accent",paper.accent);
        card.setAttribute("aria-label","開啟第 "+paper.number+" 篇："+paper.title);
        const head=make("span","card-head");
        head.append(make("span","paper-number",paper.number),make("span","paper-year",paper.year));
        const body=make("span","card-body");
        body.append(make("span","journal",paper.journal));
        const title=make("h3",null,paper.title);
        body.append(title,make("span","subtitle",paper.subtitle),make("span","description",paper.description));
        const tags=make("span","tags");
        paper.tags.forEach(function(tag){tags.append(make("span","tag",tag))});
        const openLine=make("span","open-line");
        openLine.append(make("span",null,"閱讀完整導讀"),make("span",null,"→"));
        body.append(tags,openLine);
        card.append(head,body);
        card.addEventListener("click",function(){openPaper(index,true)});
        paperGrid.append(card);
        const option=document.createElement("option");
        option.value=paper.id;
        option.textContent=paper.number+"｜"+paper.title;
        paperSelect.append(option);
      });
    }

    function setRoute(paper,push){
      const url=paper?"#paper="+encodeURIComponent(paper.id):location.pathname+location.search;
      if(push)history.pushState({paper:paper?paper.id:null},"",url);
      else history.replaceState({paper:paper?paper.id:null},"",url);
    }

    function openPaper(index,push){
      const paper=papers[index];
      if(!paper)return;
      currentIndex=index;
      homeView.hidden=true;
      readerView.classList.add("active");
      document.body.style.overflow="hidden";
      readerBar.style.setProperty("--accent",paper.accent);
      readerKicker.textContent="第 "+paper.number+" 篇 · "+paper.year;
      readerTitle.textContent=paper.title;
      paperSelect.value=paper.id;
      previousButton.disabled=index===0;
      nextButton.disabled=index===papers.length-1;
      paperFrame.title="第 "+paper.number+" 篇："+paper.title;
      frameLoading.hidden=false;
      paperFrame.srcdoc=decodePage(paper.html);
      setRoute(paper,push);
      document.title=paper.title+"｜論文導讀庫";
      document.getElementById("homeButton").focus({preventScroll:true});
    }

    function showHome(push){
      currentIndex=-1;
      paperFrame.srcdoc="";
      readerView.classList.remove("active");
      homeView.hidden=false;
      document.body.style.overflow="";
      frameLoading.hidden=false;
      if(push)setRoute(null,true);
      document.title="數位學習論文導讀庫";
      document.querySelector(".paper-card").focus({preventScroll:true});
    }

    function handleShortcut(event){
      if(currentIndex<0)return;
      if(event.key==="Escape"){
        event.preventDefault();
        showHome(true);
        return;
      }
      if(!event.altKey)return;
      if(event.key==="ArrowLeft"&&currentIndex>0){event.preventDefault();openPaper(currentIndex-1,true)}
      if(event.key==="ArrowRight"&&currentIndex<papers.length-1){event.preventDefault();openPaper(currentIndex+1,true)}
    }

    paperFrame.addEventListener("load",function(){
      frameLoading.hidden=true;
      try{
        const child=paperFrame.contentWindow;
        if(iframeKeyHandler)child.removeEventListener("keydown",iframeKeyHandler);
        iframeKeyHandler=handleShortcut;
        child.addEventListener("keydown",iframeKeyHandler);
      }catch(error){console.warn("無法綁定內頁快捷鍵",error)}
    });
    document.getElementById("homeButton").addEventListener("click",function(){showHome(true)});
    previousButton.addEventListener("click",function(){if(currentIndex>0)openPaper(currentIndex-1,true)});
    nextButton.addEventListener("click",function(){if(currentIndex<papers.length-1)openPaper(currentIndex+1,true)});
    paperSelect.addEventListener("change",function(){
      const index=papers.findIndex(function(paper){return paper.id===paperSelect.value});
      openPaper(index,true);
    });
    document.getElementById("printButton").addEventListener("click",function(){
      try{paperFrame.contentWindow.print()}catch(error){window.print()}
    });
    document.addEventListener("keydown",handleShortcut);
    window.addEventListener("popstate",function(){routeFromLocation(false)});

    function routeFromLocation(replace){
      const match=location.hash.match(/^#paper=([^&]+)/);
      if(!match){
        if(currentIndex>=0)showHome(false);
        if(replace)setRoute(null,false);
        return;
      }
      const id=decodeURIComponent(match[1]);
      const index=papers.findIndex(function(paper){return paper.id===id});
      if(index>=0)openPaper(index,false);
      else showHome(false);
    }

    renderHome();
    routeFromLocation(true);
  </script>
</body>
</html>
